<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Rendify cover: a 2D floor plan transformed into a rendered 3D view">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#171410" opacity="0.07" />
    </pattern>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2551b" />
      <stop offset="1" stop-color="#9a3412" />
    </linearGradient>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="#f7f4ed" />
  <rect width="1200" height="675" fill="url(#dots)" />

  <!-- label -->
  <g class="mono" fill="#6a6455" font-size="15" letter-spacing="3">
    <text x="72" y="86">RENDIFY</text>
    <text x="1046" y="86" text-anchor="end" opacity="0.8">01 / 02</text>
  </g>
  <line x1="72" y1="106" x2="1128" y2="106" stroke="#e3dccd" stroke-width="2" />

  <!-- ============ LEFT: flat 2D plan ============ -->
  <g transform="translate(96 190) scale(0.92)" stroke="#171410" fill="none">
    <rect x="0" y="0" width="400" height="300" stroke-width="7" />
    <line x1="220" y1="0" x2="220" y2="180" stroke-width="4" />
    <line x1="0" y1="180" x2="220" y2="180" stroke-width="4" />
    <line x1="140" y1="180" x2="140" y2="300" stroke-width="4" />
    <!-- door swings -->
    <path d="M220 120 a30 30 0 0 1 30 30" stroke-width="2" stroke-dasharray="4 5" opacity="0.7" />
    <path d="M120 180 a24 24 0 0 0 -24 24" stroke-width="2" stroke-dasharray="4 5" opacity="0.7" />
    <!-- fixture marks -->
    <rect x="252" y="26" width="120" height="16" stroke-width="2" opacity="0.5" />
    <circle cx="372" cy="34" r="9" stroke-width="2" opacity="0.5" />
    <rect x="30" y="212" width="82" height="66" stroke-width="2" opacity="0.5" />
  </g>

  <!-- arrow -->
  <g transform="translate(600 340)" stroke="#c2410c" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="-34" y1="0" x2="26" y2="0" />
    <polyline points="12,-13 26,0 12,13" />
  </g>

  <!-- ============ RIGHT: rendered plan ============ -->
  <g transform="translate(636 168) scale(0.92)">
    <!-- floors -->
    <rect x="4" y="4" width="212" height="172" fill="#efe7d7" />
    <rect x="224" y="4" width="172" height="172" fill="#e9e0cd" />
    <rect x="4" y="184" width="132" height="112" fill="#e9e0cd" />
    <rect x="144" y="184" width="252" height="112" fill="#efe7d7" />
    <!-- rug + sofa -->
    <rect x="26" y="86" width="150" height="76" rx="6" fill="#ddcdb2" opacity="0.9" />
    <rect x="34" y="100" width="118" height="34" rx="6" fill="#c2410c" />
    <rect x="34" y="100" width="118" height="12" rx="6" fill="#d9591f" />
    <rect x="162" y="98" width="16" height="40" rx="5" fill="#b23a10" />
    <!-- coffee table -->
    <rect x="72" y="40" width="66" height="28" rx="5" fill="#9a6935" />
    <!-- kitchen counter + island -->
    <rect x="232" y="12" width="156" height="26" rx="4" fill="#3b352b" />
    <rect x="296" y="62" width="76" height="44" rx="5" fill="#5c5346" />
    <circle cx="366" cy="25" r="8" fill="#8c8477" />
    <!-- bed + nightstand -->
    <rect x="22" y="196" width="94" height="84" rx="6" fill="#ded3c0" />
    <rect x="30" y="204" width="78" height="26" rx="5" fill="#fdfaf3" />
    <rect x="102" y="196" width="14" height="20" rx="3" fill="#9a6935" />
    <!-- bath -->
    <rect x="196" y="200" width="74" height="52" rx="10" fill="#fdfaf3" stroke="#d7cdb9" stroke-width="2" />
    <rect x="286" y="200" width="40" height="34" rx="5" fill="#fdfaf3" stroke="#d7cdb9" stroke-width="2" />
    <rect x="344" y="200" width="48" height="72" rx="6" fill="#cdbfa5" opacity="0.8" />
    <!-- extruded walls -->
    <rect x="0" y="0" width="400" height="300" fill="none" stroke="#241f16" stroke-width="11" />
    <line x1="220" y1="0" x2="220" y2="180" stroke="#241f16" stroke-width="8" />
    <line x1="0" y1="180" x2="220" y2="180" stroke="#241f16" stroke-width="8" />
    <line x1="140" y1="180" x2="140" y2="300" stroke="#241f16" stroke-width="8" />
    <!-- door gaps -->
    <line x1="220" y1="112" x2="220" y2="158" stroke="#efe7d7" stroke-width="8" />
    <line x1="92" y1="180" x2="130" y2="180" stroke="#efe7d7" stroke-width="8" />
    <!-- windows -->
    <line x1="40" y1="0" x2="150" y2="0" stroke="#8fb6c4" stroke-width="11" />
    <line x1="400" y1="60" x2="400" y2="140" stroke="#8fb6c4" stroke-width="11" />
  </g>

  <!-- bottom rule + caption -->
  <line x1="72" y1="592" x2="1128" y2="592" stroke="#e3dccd" stroke-width="2" />
  <g class="mono" font-size="14" letter-spacing="2" fill="#6a6455">
    <text x="72" y="626">2D FLOOR PLAN</text>
    <text x="1046" y="626" text-anchor="end">GEMINI IMAGE MODEL · PUTER.JS</text>
  </g>
  <rect x="72" y="604" width="8" height="8" fill="url(#ember)" transform="translate(0 -22)" />
</svg>
